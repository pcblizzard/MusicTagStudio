[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "musictagstudio"
version = "0.6.6"
description = "A safe, preview-first audio metadata editor"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "mutagen>=1.47",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
