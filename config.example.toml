[appearance]
theme = "automatic"
style = "standard"
language = "automatic"
# Zusaetzliche Schriftskalierung (0.8-1.6, 1.0 = Standard).
font_scale = 1.0

[providers]
selected = "apple_music"
enrich_missing_fields = true
apple_country = "DE"

[behavior]
preview_before_writing = true

[normalization]
feature_handling = "artist_only"

[cover_sources]
selected = "apple_music"
fallback_enabled = true
minimum_size = 1000
cache_max_age_days = 30

[cover_output]
master_pattern = "{album_artist} - {album}.front.{ext}"
embedded_size = 1000
embedded_quality = 100
folder_size = 400
folder_quality = 80
folder_pattern = "{album_artist} - {album}_400px.jpg"
artist_folder_levels_up = 2

[audio_analysis]
parallel_jobs = 0

[media_library]
discogs_token = ""
tidal_client_id = ""
spotify_client_id = ""
# Akustischer Fingerabdruck (AcoustID). Leer = mitgelieferter App-Key.
acoustid_api_key = ""
# Optionaler Pfad zur fpcalc-Binärdatei (sonst Bundle/PATH).
fpcalc_path = ""

[network]
apple_request_interval_seconds = 1.5
genius_request_interval_seconds = 1.0
# Öffentliche Apple-Music-Websuche als Fallback für Alben, die die
# iTunes-Such-API nicht indexiert (nur Metadaten, kein Login).
apple_web_search_enabled = true
# Quelle für die 30-Sekunden-Track-Vorschau: "deezer" oder "apple_music".
preview_source = "deezer"

[library]
load_sources_on_startup = true
scan_sources_on_startup = true

[[music_sources]]
id = "example"
name = "Music"
path = "C:\\Users\\YourName\\Music"
enabled = false
