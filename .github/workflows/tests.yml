name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      # Beide Python-Versionen immer vollständig prüfen, statt bei der ersten
      # fehlschlagenden Version die andere abzubrechen.
      fail-fast: false
      matrix:
        # Ränder der unterstützten Spanne (requires-python >=3.12): Untergrenze
        # 3.12 und neueste 3.14. Die Mitte (3.13) liegt sicher dazwischen.
        python-version: ["3.12", "3.14"]
    env:
      # Headless Qt: erzwingt das Offscreen-Backend, damit QMediaPlayer/
      # QAudioOutput ohne Audiogerät nicht nativ abstürzen (flaky auf 3.12).
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff (Lint)
        run: python -m ruff check src tests
      - name: Mypy (Typprüfung)
        run: python -m mypy
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest -q
